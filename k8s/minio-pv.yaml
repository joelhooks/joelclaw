# Render this template with k8s/render-nas-pv.sh before applying.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-nfs-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  mountOptions:
    - nfsvers=3
    - tcp
    - resvport
  nfs:
    server: "${K8S_NAS_HOST}"
    path: "${K8S_NAS_MINIO_EXPORT}"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: joelclaw
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Ti
  volumeName: minio-nfs-pv
