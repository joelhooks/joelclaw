# NAS NVMe tier — NFS-backed PersistentVolume (ADR-0088 Phase 2)
# Render this template with k8s/render-nas-pv.sh before applying.
# See .brain/resources/operator-network-context.svx in the private dark-wizard repo
# and the tailnet-topology skill for the export and VM route.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-nvme
  labels:
    tier: nvme
    location: nas
spec:
  capacity:
    storage: 1500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "${K8S_NAS_HOST}"
    path: "${K8S_NAS_NVME_EXPORT}"
  mountOptions:
    - nfsvers=3
    - tcp
    - resvport
    - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-nvme
  namespace: joelclaw
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1500Gi
  volumeName: nas-nvme
  storageClassName: ""
