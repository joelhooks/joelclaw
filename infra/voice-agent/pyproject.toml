[project]
name = "joelclaw-voice-agent"
version = "0.1.0"
description = "joelclaw voice agent — bidirectional voice conversations with system tool access"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "livekit-agents[elevenlabs,silero,turn-detector,deepgram]==1.8.9",
    "livekit-plugins-openai==1.8.9",
    "livekit-plugins-elevenlabs==1.8.9",
    "livekit-plugins-deepgram==1.8.9",
    "livekit-plugins-silero==1.8.9",
    "livekit-plugins-turn-detector==1.8.9",
    "livekit-plugins-noise-cancellation==0.3.2",
    "transformers==5.5.0",
    "openai==3.37.0",
    "pyyaml>=6.0.3",
    "convex>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
